[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rushtools"
version = "0.1.0"
description = "Small, tested helpers for everyday plant bioinformatics: sequences, FASTA/FASTQ, assembly stats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Halireena Rushdiha Mohomed", email = "217553546+halireena@users.noreply.github.com" }]
keywords = ["bioinformatics", "DNA", "FASTA", "teaching"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rushtools = "rushtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
