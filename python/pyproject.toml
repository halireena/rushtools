[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rushtools"
version = "0.2.0"
description = "Small, tested helpers for everyday plant bioinformatics: sequences, FASTA/FASTQ, assembly stats."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Halireena Rushdiha Mohomed", email = "217553546+halireena@users.noreply.github.com" }]
keywords = ["bioinformatics", "DNA", "FASTA", "teaching"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
rushtools = "rushtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rushtools = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
